[agent]
  interval = "5s"
  flush_interval = "5s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["jenkins/builds/events"]
  data_format = "json"
  json_string_fields = ["level", "service", "message", "source", "event_type", "anomaly_reason"]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "gid-secret-token"
  organization = "tgr"
  bucket = "jenkins_events"
